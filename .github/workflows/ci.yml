name: CI

on:
  push:
    branches: [main, claude/ai-education-dashboard-S88zO]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit & API tests (offline embedder, Ollama unavailable)
        run: pytest -q
      - name: Cache Hugging Face models
        if: matrix.python-version == '3.11'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Real-model retrieval test (downloads all-MiniLM-L6-v2)
        if: matrix.python-version == '3.11'
        env:
          RUN_MODEL_TESTS: "1"
        run: pytest -q -m real_model

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t education-dashboard-backend .
      - name: Smoke-test container health endpoint
        run: |
          docker run -d --name api -p 8000:8000 education-dashboard-backend
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health; then echo; exit 0; fi
            sleep 3
          done
          docker logs api
          exit 1
