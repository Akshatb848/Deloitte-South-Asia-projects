version: '3.8'

services:
  # Backend API
  backend:
    build: .
    container_name: education-dashboard-backend
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=mistral:7b-instruct
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./vector_db:/app/vector_db
      - ./logs:/app/logs
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - education-network

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: education-dashboard-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - education-network

  # Frontend (Nginx)
  frontend:
    image: nginx:alpine
    container_name: education-dashboard-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - education-network

volumes:
  ollama-data:
    driver: local

networks:
  education-network:
    driver: bridge
